name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Security audit (pip-audit)
        run: |
          pip-audit --desc || echo "::warning::pip-audit found vulnerabilities (see above)"

      - name: Lint with ruff
        run: |
          ruff check backend/ --select E,F --ignore E501,E741

      - name: Run backend tests
        run: |
          python -m pytest tests/ -v --tb=short --timeout=60 --cov=backend --cov-report=term-missing --cov-fail-under=25
        env:
          BENCHMAX_LOG_LEVEL: WARNING

      - name: Run smoke test (imports)
        run: |
          python -c "from backend.main import app; print('Import OK')"

  frontend-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Security audit (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
